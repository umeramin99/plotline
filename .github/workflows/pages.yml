# Publishes docs/ to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". A workflow cannot do this for you. configure-pages has an
# `enablement` input, but creating a Pages site needs `administration: write`,
# which GITHUB_TOKEN is never granted -- it fails with "Resource not accessible
# by integration". Only an admin PAT can enable Pages from a workflow.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
